name: Build Nowhere iOS

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build-ios:
    name: Build & Package iOS App (.ipa & .app)
    runs-on: macos-14

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Select Xcode Version
        run: |
          echo "Available Xcode versions:"
          ls -d /Applications/Xcode* 2>/dev/null || true
          if [ -d "/Applications/Xcode_15.4.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.4.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.0.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.0.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.1.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.1.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.2.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.2.app/Contents/Developer
          elif [ -d "/Applications/Xcode_16.app" ]; then
            sudo xcode-select -s /Applications/Xcode_16.app/Contents/Developer
          elif [ -d "/Applications/Xcode_15.app" ]; then
            sudo xcode-select -s /Applications/Xcode_15.app/Contents/Developer
          fi
          xcodebuild -version

      - name: Build iOS App for Device
        run: |
          cd ios
          xcodebuild -list
          xcodebuild clean build \
            -project Nowhere.xcodeproj \
            -scheme Nowhere \
            -sdk iphoneos \
            -configuration Release \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            AD_HOC_CODE_SIGNING_ALLOWED=YES \
            DEVELOPMENT_TEAM="" \
            CODE_SIGN_IDENTITY="" \
            PROVISIONING_PROFILE="" \
            SYMROOT=build

      - name: Package Native iOS .ipa and .zip
        id: package_ios
        run: |
          mkdir -p output_ios/Payload
          APP_PATH=$(find ios/build -name "Nowhere.app" -type d | head -n 1)
          if [ -z "$APP_PATH" ]; then
            echo "Error: Nowhere.app not found in ios/build!"
            exit 1
          fi
          echo "Discovered app at: $APP_PATH"
          cp -R "$APP_PATH" output_ios/Payload/
          cd output_ios
          zip -r Nowhere.ipa Payload
          zip -r Nowhere-iOS-Release.zip Payload/Nowhere.app
          cd ..
          VERSION="1.2.${{ github.run_number }}"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Upload iOS IPA Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-iOS-IPA
          path: output_ios/Nowhere.ipa
          if-no-files-found: warn
          retention-days: 14

      - name: Upload iOS App Bundle
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-iOS-App-Bundle
          path: output_ios/Nowhere-iOS-Release.zip
          if-no-files-found: warn
          retention-days: 14

      - name: Publish iOS Release Assets
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: ios-v${{ steps.package_ios.outputs.version }}
          name: Nowhere iOS v${{ steps.package_ios.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: false
          fail_on_unmatched_files: false
          files: |
            output_ios/Nowhere.ipa
            output_ios/Nowhere-iOS-Release.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
