name: Build Nowhere APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Line Endings and Permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}

      - name: List Generated APK Files and Extract Version
        id: extract_version
        run: |
          echo "=== Debug APKs ==="
          ls -la app/build/outputs/apk/debug/ || true
          echo "=== Release APKs ==="
          ls -la app/build/outputs/apk/release/ || true
          RELEASE_APK=$(ls app/build/outputs/apk/release/Nowhere-*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            APK_BASENAME=$(basename "$RELEASE_APK")
            VERSION=$(echo "$APK_BASENAME" | sed -E 's/Nowhere-v([0-9.]+)-release.apk/\1/')
            echo "EXTRACTED_VERSION=$VERSION" >> $GITHUB_ENV
            echo "Extracted Version: $VERSION"
          else
            echo "EXTRACTED_VERSION=1.0.${{ github.run_number }}" >> $GITHUB_ENV
          fi

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-Debug-APK-v${{ env.EXTRACTED_VERSION }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-Release-APK-v${{ env.EXTRACTED_VERSION }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Publish GitHub Release (Progressive Updates)
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.EXTRACTED_VERSION }}
          name: Nowhere v${{ env.EXTRACTED_VERSION }}
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

