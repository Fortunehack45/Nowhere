name: Build Nowhere APK & AAB

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  build:
    name: Build & Package Android (APK & AAB)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Line Endings and Permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Decode Release Keystore
        if: env.NOWHERE_KEYSTORE_BASE64 != ''
        run: |
          echo "$NOWHERE_KEYSTORE_BASE64" | base64 -d > app/nowhere_key.jks
          echo "Release keystore decoded successfully: $(ls -lh app/nowhere_key.jks)"
        env:
          NOWHERE_KEYSTORE_BASE64: ${{ secrets.NOWHERE_KEYSTORE_BASE64 }}

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --continue --stacktrace

      - name: Build Debug & Release APKs and Google Play Bundle (AAB)
        run: ./gradlew assembleDebug assembleRelease bundleRelease --stacktrace
        env:
          GITHUB_RUN_NUMBER: ${{ github.run_number }}
          NOWHERE_KEYSTORE_PATH: nowhere_key.jks
          NOWHERE_KEYSTORE_PASSWORD: ${{ secrets.NOWHERE_KEYSTORE_PASSWORD }}
          NOWHERE_KEY_ALIAS: ${{ secrets.NOWHERE_KEY_ALIAS }}
          NOWHERE_KEY_PASSWORD: ${{ secrets.NOWHERE_KEY_PASSWORD }}

      - name: Verify Release APK Signature
        run: |
          echo "=== Verifying Release APK Signature ==="
          RELEASE_APK=$(ls app/build/outputs/apk/release/*.apk 2>/dev/null | head -n 1)
          if [ -z "$RELEASE_APK" ]; then
            echo "Error: Release APK not found!"
            exit 1
          fi
          $ANDROID_HOME/build-tools/35.0.0/apksigner verify -v "$RELEASE_APK" || {
            echo "ERROR: Release APK signature verification failed! Package is unsigned or corrupt."
            exit 1
          }
          echo "SUCCESS: Release APK signature is verified and valid!"

      - name: Verify 16 KB Page Alignment on 64-bit Native Libraries
        run: |
          echo "=== Auditing 16 KB Alignment for 64-bit Native Libraries in Release AAB ==="
          mkdir -p aab_check
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n 1)
          if [ -z "$AAB_FILE" ]; then
            echo "Error: Release AAB not found!"
            exit 1
          fi
          unzip -q "$AAB_FILE" -d aab_check
          FAILED=0
          for so in $(find aab_check -path "*/arm64-v8a/*.so" -o -path "*/x86_64/*.so"); do
            echo "Checking $so ..."
            ALIGN=$(readelf -lW "$so" | awk '/LOAD/{print $NF}' | sort -u)
            echo "  LOAD segment alignments: $ALIGN"
            for val in $ALIGN; do
              if [ "$val" = "0x1000" ] || [ "$val" = "4096" ]; then
                echo "ERROR: $so has 4 KB alignment ($val)!"
                FAILED=1
              fi
            done
          done
          rm -rf aab_check
          if [ $FAILED -ne 0 ]; then
            echo "Build failed: One or more 64-bit native libraries do not support 16 KB page size!"
            exit 1
          fi
          echo "SUCCESS: All 64-bit native libraries are 16 KB page-aligned (>= 0x4000)!"

      - name: List Generated APK & AAB Files and Extract Version
        id: extract_version
        run: |
          echo "=== Debug APKs ==="
          ls -la app/build/outputs/apk/debug/ || true
          echo "=== Release APKs ==="
          ls -la app/build/outputs/apk/release/ || true
          echo "=== Release Bundles (AAB) ==="
          ls -la app/build/outputs/bundle/release/ || true
          RELEASE_APK=$(ls app/build/outputs/apk/release/Nowhere-*.apk 2>/dev/null | head -n 1)
          if [ -n "$RELEASE_APK" ]; then
            APK_BASENAME=$(basename "$RELEASE_APK")
            VERSION=$(echo "$APK_BASENAME" | sed -E 's/Nowhere-v([0-9.]+)-release.apk/\1/')
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "Extracted Version: $VERSION"
          else
            VERSION="1.0.${{ github.run_number }}"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          fi
          # Ensure branded AAB exists for Google Play Store release
          AAB_FILE=$(ls app/build/outputs/bundle/release/*.aab 2>/dev/null | head -n 1)
          if [ -n "$AAB_FILE" ] && [ ! -f "app/build/outputs/bundle/release/Nowhere-v${VERSION}-release.aab" ]; then
            cp "$AAB_FILE" "app/build/outputs/bundle/release/Nowhere-v${VERSION}-release.aab"
          fi

      - name: Publish GitHub Release (Progressive Updates)
        if: (github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')) || github.event_name == 'workflow_dispatch'
        uses: softprops/action-gh-release@v2
        continue-on-error: true
        with:
          tag_name: v${{ steps.extract_version.outputs.version }}
          name: Nowhere v${{ steps.extract_version.outputs.version }}
          generate_release_notes: true
          draft: false
          prerelease: false
          make_latest: true
          fail_on_unmatched_files: false
          files: |
            app/build/outputs/apk/release/*.apk
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/bundle/release/*.aab
            app/build/outputs/mapping/release/*.txt
            app/build/outputs/native-debug-symbols.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Upload Google Play AAB Bundle Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-PlayStore-AAB-v${{ steps.extract_version.outputs.version }}
          path: app/build/outputs/bundle/release/*.aab
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Native Debug Symbols Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-Native-Debug-Symbols-v${{ steps.extract_version.outputs.version }}
          path: app/build/outputs/native-debug-symbols.zip
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Deobfuscation Mapping Artifact (mapping.txt)
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-Deobfuscation-Mapping-v${{ steps.extract_version.outputs.version }}
          path: app/build/outputs/mapping/release/*.txt
          if-no-files-found: ignore
          retention-days: 30

      - name: Upload Release APK Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-Release-APK-v${{ steps.extract_version.outputs.version }}
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK Artifact
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-Debug-APK-v${{ steps.extract_version.outputs.version }}
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: warn
          retention-days: 7
