name: Build Nowhere APK

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    name: Build & Package APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix Line Endings and Permissions
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew

      - name: Run Unit Tests
        run: ./gradlew testDebugUnitTest --stacktrace

      - name: Build Debug & Release APKs
        run: ./gradlew assembleDebug assembleRelease --stacktrace

      - name: List Generated APK Files
        run: ls -la app/build/outputs/apk/debug/ || true

      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          if-no-files-found: error
          retention-days: 14

      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: Nowhere-Release-Unsigned-APK
          path: app/build/outputs/apk/release/*.apk
          if-no-files-found: warn
          retention-days: 14
