version: '3.8'

services:
  nowhere-vpn-backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
    container_name: nowhere-vpn-backend
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      - PORT=8080
      - CONFIG_DIR=/app/config
      - SSH_DEFAULT_KEY=/secrets/nowhere_deploy.pem
      - API_KEYS=nowhere_live_prod_key_77a9c84e1b,nowhere_test_stage_key_88b9a1
    volumes:
      - ../config:/app/config:ro
      - ./secrets:/secrets:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8080/health"]
      interval: 30s
      timeout: 5s
      retries: 3
