    region_group: us_central
    country: US
    country_name: United States
    city: Council Bluffs (US Central)
    endpoint: 104.197.128.154:51820
    server_pubkey: 0/Ji7Sp0ZEDdQ0n04aL3WTRLu/arq3w9yRghJAscgQg=
